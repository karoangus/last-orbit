<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Void Runner — سفر به ایستگاه آلفا</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<style>
  :root{
    --bg:#04040d;
    --cyan:#22d3ee;
    --magenta:#e879f9;
    --yellow:#facc15;
    --green:#4ade80;
    --red:#f87171;
    --mono:'Consolas','Menlo','Monaco','Courier New',monospace;
    --ui:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);
    background-image:radial-gradient(1200px 600px at 80% -10%, rgba(124,58,237,.14), transparent 60%),
                     radial-gradient(900px 500px at 10% 110%, rgba(34,211,238,.10), transparent 60%);
    color:#e2e8f0;
    font-family:var(--ui);
    -webkit-tap-highlight-color:transparent;
  }
  /* ---------- پس‌زمینه و لایه‌های تزئینی ---------- */
  .gridv{position:fixed;inset:0;pointer-events:none;z-index:0;
    background:repeating-linear-gradient(90deg, rgba(34,211,238,.05) 0 1px, transparent 1px 90px);}
  .gridfloor{position:fixed;left:-30%;right:-30%;bottom:-12%;height:52%;pointer-events:none;z-index:0;
    background:repeating-linear-gradient(0deg, rgba(34,211,238,.16) 0 1px, transparent 1px 42px);
    transform:perspective(320px) rotateX(64deg);transform-origin:bottom;
    -webkit-mask-image:linear-gradient(transparent, #000 45%);
    mask-image:linear-gradient(transparent, #000 45%);}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:44;
    background:radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.55));}
  #lowo2{position:fixed;inset:0;pointer-events:none;z-index:43;opacity:0;transition:opacity .5s;
    background:radial-gradient(ellipse at center, transparent 52%, rgba(248,113,113,.28));}
  #lowo2.on{opacity:1;animation:redPulse 1.6s ease-in-out infinite}
  @keyframes redPulse{0%,100%{opacity:.5}50%{opacity:1}}
  #heatGlow{position:fixed;inset:0;pointer-events:none;z-index:43;opacity:0;transition:opacity .45s;
    background:radial-gradient(ellipse at center, transparent 50%, rgba(251,146,60,.35))}

  /* ---------- چیدمان ---------- */
  .wrap{display:flex;flex-direction:column;gap:12px;height:100vh;height:100dvh;
    padding:12px clamp(10px,3vw,28px) 14px;position:relative;z-index:1;max-width:920px;margin:0 auto}
  /* truncated for this simulation - in real call the full 58k content is used */
</style>
</head>
